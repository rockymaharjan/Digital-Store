
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Ledger | Digital Store</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Inter, Arial, sans-serif;
            background: #f1f5f9;
            color: #142D4E;
            margin: 0;
            padding: 28px 22px;
            font-size: 13px;
        }

        .container {
            max-width: 1300px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding-bottom: 20px;
            border-bottom: 2px solid #142D4E;
        }

        h2 {
            margin: 0;
            font-size: 21px;
        }

        button {
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .back-button {
            background: #142D4E;
            color: white;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 23px 0;
        }

        .summary-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            padding: 19px;
            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.04);
        }

        .summary-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #64748b;
            font-weight: 700;
        }

        .summary-value {
            font-size: 21px;
            font-weight: 700;
            margin-top: 10px;
        }

        .heading {
            font-size: 16px;
            margin: 28px 0 12px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        input {
            width: 300px;
            max-width: 100%;
            padding: 11px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-family: inherit;
            font-size: 12px;
            background: white;
        }

        #message {
            color: #64748b;
            font-size: 12px;
        }

        .table-container {
            overflow-x: auto;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            padding: 12px;
        }

        table {
            width: 100%;
            min-width: 1050px;
            border-collapse: collapse;
        }

        th, td {
            padding: 13px 11px;
            border-bottom: 1px solid #e8edf3;
            text-align: left;
            white-space: nowrap;
            font-size: 11px;
        }

        th {
            color: #64748b;
            background: #f8fafc;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tbody tr {
            cursor: pointer;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
        }

        .pending {
            background: #fef3c7;
            color: #92400e;
        }

        .paid, .delivered {
            background: #dcfce7;
            color: #166534;
        }

        .failed, .cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        .processing, .confirmed {
            background: #dbeafe;
            color: #1e40af;
        }

        .shipped {
            background: #ede9fe;
            color: #5b21b6;
        }

        @media(max-width: 700px) {
            body { padding: 15px 10px; }

            .summary {
                grid-template-columns: 1fr;
            }

            h2 { font-size: 18px; }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h2>Digital Store | Sales Ledger</h2>
        <button class="back-button" onclick="window.location.href='admin-dashboard.html'">
            ← Dashboard
        </button>
    </header>

    <div class="summary">

        <div class="summary-card">
            <div class="summary-label">Total Order Value</div>
            <div class="summary-value" id="totalValue">NPR 0</div>
        </div>

        <div class="summary-card">
            <div class="summary-label">Payments Marked Paid</div>
            <div class="summary-value" id="paidValue">NPR 0</div>
        </div>

        <div class="summary-card">
            <div class="summary-label">Total Orders</div>
            <div class="summary-value" id="orderCount">0</div>
        </div>

    </div>

    <h3 class="heading">Transaction Records</h3>

    <div class="toolbar">
        <input
            type="text"
            id="searchInput"
            placeholder="Search by customer or order ID..."
        >

        <span id="message">Loading ledger...</span>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Date</th>
                    <th>Customer</th>
                    <th>Payment Method</th>
                    <th>Order Value</th>
                    <th>Payment Status</th>
                    <th>Order Status</th>
                </tr>
            </thead>

            <tbody id="ledgerTable"></tbody>
        </table>
    </div>

</div>

<script>
    const token = sessionStorage.getItem("adminToken");

    let ledgerRecords = [];

    if (!token) {
        window.location.href = "admin-login.html";
    }

    function formatMoney(amount) {
        return "NPR " + Number(amount || 0).toLocaleString();
    }

    function createStatusCell(status) {
        const cell = document.createElement("td");
        const label = document.createElement("span");

        const safeStatus = status || "Pending";

        label.textContent = safeStatus;
        label.className = "status " +
            safeStatus.toLowerCase().replace(/\s+/g, "-");

        cell.appendChild(label);
        return cell;
    }

    function renderLedger(records) {
        const table = document.getElementById("ledgerTable");

        table.replaceChildren();

        if (records.length === 0) {
            document.getElementById("message").textContent =
                "No matching records found.";
            return;
        }

        records.forEach(record => {
            const row = document.createElement("tr");

            const values = [
                "#" + record.order_id,
                record.order_date
                    ? new Date(record.order_date).toLocaleDateString()
                    : "-",
                record.customer_name,
                record.payment_method,
                formatMoney(record.total_amount)
            ];

            values.forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value ?? "-";
                row.appendChild(cell);
            });

            row.appendChild(createStatusCell(record.payment_status));
            row.appendChild(createStatusCell(record.order_status));

            row.addEventListener("click", function() {
                window.location.href =
                    "order-details.html?id=" + record.order_id;
            });

            table.appendChild(row);
        });

        document.getElementById("message").textContent =
            "Showing " + records.length + " of " +
            ledgerRecords.length + " records";
    }

    async function loadLedger() {
        try {
            const response = await fetch(
                "http://localhost:5000/api/admin/ledger",
                {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );

            if (response.status === 401 || response.status === 403) {
                sessionStorage.removeItem("adminToken");
                window.location.href = "admin-login.html";
                return;
            }

            if (!response.ok) {
                throw new Error("Could not load ledger records");
            }

            ledgerRecords = await response.json();

            const totalValue = ledgerRecords.reduce(
                (sum, record) => sum + Number(record.total_amount || 0),
                0
            );

            const paidValue = ledgerRecords.reduce(
                (sum, record) => {
                    if (record.payment_status === "Paid") {
                        return sum + Number(record.payment_amount || 0);
                    }

                    return sum;
                },
                0
            );

            document.getElementById("totalValue").textContent =
                formatMoney(totalValue);

            document.getElementById("paidValue").textContent =
                formatMoney(paidValue);

            document.getElementById("orderCount").textContent =
                ledgerRecords.length;

            renderLedger(ledgerRecords);

        } catch (error) {
            document.getElementById("message").textContent =
                error.message;
        }
    }

    document.getElementById("searchInput")
        .addEventListener("input", function() {

            const search = this.value.toLowerCase().trim();

            const filteredRecords = ledgerRecords.filter(record =>
                String(record.order_id).includes(search) ||
                (record.customer_name || "").toLowerCase().includes(search)
            );

            renderLedger(filteredRecords);
        });

    if (token) {
        loadLedger();
    }
</script>

</body>
</html>
