
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Digital Store</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0b1729, #142D4E, #1e3a5f);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px 100px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: #ffffff;
            padding: 38px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
        }

        /* Main logo and store name */
        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand img {
            width: 170px;
            height: 170px;
            object-fit: contain;
            display: block;
            margin: 0 auto 8px;
        }

        .brand h1 {
            font-size: 29px;
            font-weight: 800;
            color: #142D4E;
            letter-spacing: -1px;
        }

        .brand p {
            margin-top: 7px;
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .divider {
            height: 1px;
            background: #e8edf3;
            margin-bottom: 28px;
        }

        .login-heading {
            margin-bottom: 24px;
        }

        .login-heading h2 {
            color: #172b45;
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-heading p {
            color: #718096;
            font-size: 13px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 19px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 9px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #dce3ec;
            border-radius: 9px;
            font-family: inherit;
            font-size: 14px;
            color: #172b45;
            outline: none;
            transition: 0.2s ease;
        }

        .form-group input:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .login-button {
            width: 100%;
            padding: 15px;
            margin-top: 7px;
            border: none;
            border-radius: 9px;
            background: #2563EB;
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .login-button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .login-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            min-height: 20px;
            margin-top: 16px;
            font-size: 13px;
            text-align: center;
            color: #dc2626;
        }

        /* Bottom-right logo ABOVE store name */
        .page-brand {
            position: fixed;
            right: 25px;
            bottom: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: #ffffff;
            text-align: center;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .page-brand img {
            width: 65px;
            height: 65px;
            object-fit: contain;
            display: block;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 25px;
            }

            .brand img {
                width: 145px;
                height: 145px;
            }

            .brand h1 {
                font-size: 25px;
            }

            .page-brand {
                right: 14px;
                bottom: 10px;
                font-size: 13px;
                gap: 3px;
            }

            .page-brand img {
                width: 43px;
                height: 43px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <!-- Main logo above store name -->
            <div class="brand">

                <img
                    src="./Logo/Meshy_AI_.png"
                    alt="Digital Store Logo"
                >

                <h1>Digital Store</h1>
                <p>Admin Portal</p>

            </div>

            <div class="divider"></div>

            <div class="login-heading">
                <h2>Welcome Back</h2>
                <p>Sign in to access your store administration dashboard.</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Sign In
                </button>

                <p id="message" role="alert"></p>

            </form>

        </section>

    </main>

    <!-- Bottom-right logo ABOVE Digital Store name -->
    <div class="page-brand">

        <img
            src="./Logo/Meshy_AI_.png"
            alt="Digital Store Logo"
        >

        <span>Digital Store</span>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");
            const loginButton = document.getElementById("loginButton");

            message.textContent = "";
            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";

            try {

                const response = await fetch("http://localhost:5000/api/admin/login", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Login failed. Please try again.");
                }

                sessionStorage.setItem("adminToken", data.token);

                window.location.href = "admin-dashboard.html";

            } catch (error) {

                message.textContent = error.message;

            } finally {

                loginButton.disabled = false;
                loginButton.textContent = "Sign In";

            }
        });
    </script>

</body>
</html>
